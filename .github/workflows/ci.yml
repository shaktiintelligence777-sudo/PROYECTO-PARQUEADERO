name: CI frontend
on:
  pull_request:
    paths: ['frontend/**', 'contracts/**', '.github/workflows/ci.yml']
  push:
    branches: [main]
    paths: ['frontend/**']
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - name: Los tipos generados coinciden con el contrato (A-02 CA-17)
        run: npm run gen:api && git diff --exit-code src/api/tipos.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
