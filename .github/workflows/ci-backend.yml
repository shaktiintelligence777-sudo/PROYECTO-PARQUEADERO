# C-03 H-01: job de CI del backend (B-01 CA-9). Vivía en ci.yml y se perdió al resolver un
# conflicto de fusión con el CI del frontend; ahora va en su propio archivo para que no vuelva a
# pisarse.
name: CI backend

on:
  pull_request:
    paths: ['backend/**', 'contracts/**', '.github/workflows/ci-backend.yml']
  push:
    branches: [main]
    paths: ['backend/**', 'contracts/**', '.github/workflows/ci-backend.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: parqueadero_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/parqueadero_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Lint (incluye la regla S608 de SQL construido con cadenas, C-03 CA-5)
        run: |
          ruff check .
          ruff format --check .

      - name: Tipos
        run: mypy app

      - name: Pruebas (incluyen la matriz de permisos y las cabeceras de C-03)
        run: pytest

      - name: Construir imagen Docker
        run: docker build -t parqueadero-api .
